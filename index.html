<title>Social Parlor omnivore — Drinks</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --pink: #FF2E8B;
  --pink-light: #FF6BB5;
  --pink-dim: #C4006A;
  --pink-bg: #FFF0F7;
  --white: #FFFFFF;
  --off-white: #FFF8FC;
  --text: #1A0010;
  --text-muted: #8C4D72;
  --border: rgba(255,46,139,0.15);
  --surface: #FFFFFF;
  --surface2: #FFF5FA;
}
html, body { height: 100%; background: var(--off-white); color: var(--text); font-family: 'DM Sans','Noto Sans JP',sans-serif; font-weight:300; overflow:hidden; }
#app { display:grid; grid-template-columns:260px 1fr; height:100vh; height:100dvh; }

/* SIDEBAR */
#sidebar { background:var(--pink); display:flex; flex-direction:column; overflow:hidden; position:relative; }
#sidebar::before { content:''; position:absolute; top:-60px; left:-60px; width:260px; height:260px; border:2px solid rgba(255,255,255,0.2); border-radius:50%; pointer-events:none; }
#lang-toggle { position:absolute; top:32px; right:20px; z-index:3; background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.5); color:#fff; font-family:inherit; font-size:12px; font-weight:600; letter-spacing:0.08em; padding:6px 13px; border-radius:999px; cursor:pointer; -webkit-appearance:none; appearance:none; -webkit-tap-highlight-color:transparent; }
#lang-toggle:active { background:rgba(255,255,255,0.32); }
#logo { padding:36px 28px 28px; border-bottom:1px solid rgba(255,255,255,0.2); position:relative; z-index:1; }
#logo .brand { font-size:22px; font-weight:400; color:#fff; line-height:1.2; letter-spacing:-0.01em; }
#logo .brand span { font-weight:300; font-style:italic; }
#logo .sub { margin-top:6px; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:rgba(255,255,255,0.55); }
#genre-label { padding:20px 28px 10px; font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:rgba(255,255,255,0.45); }
#genre-list { flex:1; overflow-y:auto; padding:0 14px 24px; scrollbar-width:none; touch-action:pan-y; overscroll-behavior:contain; }
#genre-list::-webkit-scrollbar { display:none; }

.genre-btn { display:flex; align-items:center; gap:10px; width:100%; padding:11px 14px; background:none; border:none; border-radius:8px; cursor:pointer; text-align:left; color:rgba(255,255,255,0.65); font-family:'DM Sans','Noto Sans JP',sans-serif; font-weight:300; font-size:13.5px; letter-spacing:0.02em; transition:all 0.18s; }
.genre-btn:hover { color:#fff; background:rgba(255,255,255,0.1); }
.genre-btn.active { color:var(--pink); background:#fff; font-weight:500; }
.genre-icon { font-size:16px; flex-shrink:0; }
.genre-count { margin-left:auto; font-size:11px; opacity:0.5; }
.genre-btn.active .genre-count { opacity:0.4; }

/* サブカテゴリ */
.sub-list { overflow:hidden; max-height:0; transition:max-height 0.3s ease; }
.sub-list.open { max-height:300px; }
.sub-btn { display:flex; align-items:center; gap:8px; width:100%; padding:9px 14px 9px 36px; background:none; border:none; border-radius:8px; cursor:pointer; text-align:left; color:rgba(255,255,255,0.5); font-family:'DM Sans','Noto Sans JP',sans-serif; font-weight:300; font-size:12.5px; transition:all 0.18s; }
.sub-btn:hover { color:#fff; background:rgba(255,255,255,0.08); }
.sub-btn.active { color:var(--pink); background:#fff; font-weight:500; }
.sub-count { margin-left:auto; font-size:10px; opacity:0.5; }

/* MAIN */
#main { display:flex; flex-direction:column; overflow:hidden; background:var(--off-white); }
#header { padding:32px 44px 24px; border-bottom:1px solid var(--border); flex-shrink:0; display:flex; align-items:flex-end; gap:16px; }
#genre-title { font-size:32px; font-weight:400; color:var(--pink); letter-spacing:-0.02em; line-height:1; }
#genre-desc { font-size:12px; color:var(--text-muted); letter-spacing:0.08em; padding-bottom:4px; }

/* GRID */
#drink-grid { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; overscroll-behavior:contain; padding:28px 44px; display:grid; grid-template-columns:1fr; gap:14px; align-content:start; scrollbar-width:thin; scrollbar-color:var(--pink-light) transparent; }
.drink-card { background:#fff; border:1.5px solid var(--border); border-radius:12px; cursor:pointer; overflow:hidden; transition:all 0.2s; animation:fadeUp 0.35s ease both; display:flex; flex-direction:row; align-items:stretch; height:120px; }
@keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
.drink-card:hover { border-color:var(--pink-light); box-shadow:0 4px 20px rgba(255,46,139,0.12); }

.drink-img-wrap { width:120px; height:120px; aspect-ratio:unset; flex-shrink:0; overflow:hidden; background:var(--pink-bg); }
.drink-img-wrap img { width:100%; height:100%; object-fit:cover; object-position:center center; display:block; transition:transform 0.2s; }
.drink-card:hover .drink-img-wrap img { transform:scale(1.04); }
.drink-emoji-wrap { width:120px; height:120px; aspect-ratio:unset; flex-shrink:0; background:var(--pink-bg); display:flex; align-items:center; justify-content:center; font-size:44px; transition:transform 0.2s; }
.drink-card:hover .drink-emoji-wrap { transform:scale(1.04); }

.drink-info { padding:14px 20px; display:flex; flex-direction:column; justify-content:center; flex:1; overflow:hidden; }
.drink-name { font-size:12.5px; font-weight:400; color:var(--text); line-height:1.5; margin-bottom:8px; }
.drink-price { font-size:19px; font-weight:500; color:var(--pink); letter-spacing:-0.01em; }
.drink-price span { font-size:11px; color:var(--text-muted); font-weight:300; margin-left:2px; }

/* MODAL */
#modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(255,46,139,0.08); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); z-index:50; display:-webkit-flex; display:flex; -webkit-align-items:center; align-items:center; -webkit-justify-content:center; justify-content:center; padding:40px; opacity:0; visibility:hidden; pointer-events:none; -webkit-transition:opacity 0.2s, visibility 0.2s; transition:opacity 0.2s, visibility 0.2s; }
#modal-overlay.open { opacity:1; visibility:visible; pointer-events:auto; }
#modal { background:#fff; border:1.5px solid var(--border); border-radius:16px; max-width:480px; width:100%; max-height:80vh; overflow-y:auto; animation:modalIn 0.28s ease; scrollbar-width:none; position:relative; }
@keyframes modalIn { from{opacity:0;transform:scale(0.95) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
#modal-img-wrap { width:100%; aspect-ratio:1/1; overflow:hidden; border-radius:14px 14px 0 0; background:var(--pink-bg); display:flex; align-items:center; justify-content:center; }
#modal-img-wrap img { width:100%; height:100%; object-fit:contain; }
#modal-img-wrap .modal-emoji { font-size:80px; opacity:0.6; }
#modal-body { padding:28px 32px 32px; }
#modal-genre-tag { font-size:10px; letter-spacing:0.3em; text-transform:uppercase; color:var(--pink-light); margin-bottom:8px; }
#modal-name { font-size:24px; font-weight:400; color:var(--text); margin-bottom:16px; line-height:1.3; }
#modal-desc { font-size:13.5px; color:var(--text-muted); line-height:1.9; margin-bottom:24px; padding-left:14px; border-left:2px solid var(--pink-light); }
#modal-price { font-size:30px; font-weight:500; color:var(--pink); letter-spacing:-0.02em; }
#modal-price span { font-size:13px; color:var(--text-muted); font-weight:300; }
#modal-close { position:absolute; top:16px; right:16px; background:rgba(255,46,139,0.08); border:none; color:var(--pink); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.18s; z-index:10; }
#modal-close:hover { background:var(--pink); color:#fff; }









@media (max-width: 768px) {
  html, body { overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100vh; height:100dvh; }

  /* Sidebar as horizontal tab bar */
  #sidebar { width: 100%; height: auto; flex-direction: column; flex-shrink: 0; }
  #logo { padding: 16px 20px 12px; }
  #lang-toggle { top: 13px; right: 14px; font-size: 11px; padding: 5px 11px; }
  #logo .brand { font-size: 17px; }
  #logo .sub { font-size: 10px; }
  #genre-label { display: none; }
  #genre-list {
    display: flex; flex-direction: row;
    overflow-x: auto; overflow-y: hidden;
    padding: 0 8px 10px; gap: 4px; scrollbar-width: none;
    flex-shrink: 0;
    touch-action: pan-x;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  #genre-list::-webkit-scrollbar { display: none; }
  #genre-list > div { flex-shrink: 0; }
  .genre-btn { padding: 7px 12px; font-size: 12px; border-radius: 20px; white-space: nowrap; width: auto; }
  .genre-btn .genre-count { display: none; }
  .sub-list { display: none !important; }
  .sub-list.open { display: flex !important; flex-direction: row; overflow-x: auto; padding: 0 8px 8px; gap: 4px; max-height: none; touch-action: pan-x; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  .sub-btn { padding: 5px 10px; font-size: 11px; border-radius: 16px; white-space: nowrap; width: auto; }
  .sub-count { display: none; }

  /* Main */
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #header { flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  #header { padding: 14px 16px 10px; flex-shrink: 0; }
  #genre-title { font-size: 20px; }
  #genre-desc { font-size: 11px; }

  /* Grid: scrollable, cards fixed size */
  #drink-grid {
    flex: 1;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    padding-bottom: env(safe-area-inset-bottom, 20px);
    padding-bottom: env(safe-area-inset-bottom, 20px);
    padding: 12px;
    grid-template-columns: 1fr;
    gap: 10px;
    align-content: start;
  }

  /* Card: horizontal, fixed height */
  .drink-card {
    display: flex;
    flex-direction: row;
    align-items: stretch;
    border-radius: 12px;
    overflow: hidden;
    height: 110px;
    flex-shrink: 0;
  }
  .drink-img-wrap {
    width: 110px !important;
    height: 110px !important;
    aspect-ratio: unset !important;
    flex-shrink: 0;
    border-radius: 0;
    overflow: hidden;
  }
  .drink-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
  }
  .drink-emoji-wrap {
    width: 110px !important;
    height: 110px !important;
    aspect-ratio: unset !important;
    flex-shrink: 0;
    border-radius: 0;
    font-size: 36px;
  }
  .drink-info {
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    flex: 1;
    overflow: hidden;
  }
  .drink-name { font-size: 13px; margin-bottom: 8px; line-height: 1.3; }
  .drink-price { font-size: 18px; }

  /* Modal */
  #modal-overlay { padding: 12px; }
  #modal-body { padding: 20px 20px 24px; }
  #modal-name { font-size: 20px; }
  #modal-price { font-size: 24px; }
}
/* iPad横表示：モバイルと同じ上部横スクロールレイアウト */
@media (orientation: landscape) and (min-width: 769px) {
  #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  #sidebar { width: 100%; height: auto; flex-direction: column; flex-shrink: 0; }
  #lang-toggle { top: 16px; right: 18px; font-size: 12px; padding: 5px 12px; }
  #genre-label { display: none; }
  #genre-list {
    display: flex; flex-direction: row;
    overflow-x: auto; overflow-y: hidden;
    padding: 0 8px 10px; gap: 4px;
    scrollbar-width: none;
    flex-shrink: 0;
    touch-action: pan-x;
    -webkit-overflow-scrolling: touch;
  }
  #genre-list::-webkit-scrollbar { display: none; }
  #genre-list > div { flex-shrink: 0; }
  .genre-btn { padding: 7px 16px; font-size: 13px; border-radius: 20px; white-space: nowrap; width: auto; }
  .genre-btn .genre-count { display: none; }
  .sub-list { display: none !important; }
  .sub-list.open { display: flex !important; flex-direction: row; overflow-x: auto; padding: 0 8px 8px; gap: 4px; max-height: none; -webkit-overflow-scrolling: touch; }
  .sub-btn { padding: 5px 12px; font-size: 12px; border-radius: 16px; white-space: nowrap; width: auto; }
  #main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #header { flex-direction: column; align-items: center; text-align: center; gap: 8px; }
  #drink-grid {
    flex: 1 1 0; min-height: 0;
    overflow-y: auto !important;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
    padding: 12px 20px 80px;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    align-content: start;
  }
  .drink-card { height: 100px; }
  /* カード高(100px)と画像枠(既定120px)がズレて写真の下が切れていたので合わせる */
  .drink-img-wrap { width: 100px; height: 100px; align-self: center; }
  /* メインページはセンター寄せ・1列 */
  #drink-grid.top-grid { grid-template-columns: 1fr; max-width: 600px; margin: 0 auto; }
  #genre-header { padding: 8px 20px 4px; }
  #genre-title { font-size: 22px; }
  #genre-desc { font-size: 11px; }
}
/* メインページ：全デバイスでセンター寄せ・スクロール可能 */
#drink-grid.top-grid {
  display: block !important;
  overflow-y: auto;
}
#drink-grid.top-grid > div {
  min-height: auto !important;
}
</style>
</head>

  items: {

    "イカリング": { n: "Calamari Rings", d: "Tender, juicy squid in a crisp fried batter. A classic that works with beer and highballs alike.<br>Also available as a topping for the Curry of the Day (+¥800)." },

    "あさりの白ワイン蒸し": { n: "Clams Steamed in White Wine", d: "Clams quickly steamed with white wine and garlic. The broth, full of shellfish flavour, is as good as the clams themselves.<br>Add two pieces of baguette for +¥200 and soak up what is left." },
    "ミックスオリーヴ": { n: "Mixed Olives", d: "An assortment of green, black and other olives. A simple snack that suits wine and spirits equally. Mind the pits." },
    "餃子": { n: "Gyoza (Pan-Fried Dumplings)", d: "Probably the most-eaten frozen gyoza in Japan. No oil, no water, and they crisp up with a lacy skirt — a level of engineering that has outgrown the label of home cooking.<br><b>1–6 pcs ¥500 / 7–12 pcs ¥800</b>" },
    "揚げたてコーントルティーヤチップス": { n: "Freshly Fried Corn Tortilla Chips", d: "Corn tortillas fried to order for a crisp, light crunch. Simple enough to let the corn speak — perfect alongside a drink." },
    "本日のカレー": { n: "Curry of the Day", d: "The owner's homestyle European-style curry. The meat changes each time, so please ask if you would like to know what is in today's pot." },
    "チャーシューエッグ丼": { n: "Chashu & Egg Rice Bowl", d: "A rice bowl with the owner's homemade chashu — originally made as a ramen topping — and a fried egg." },
    "ポーク・カルニタス タコス": { n: "Pork Carnitas Tacos", d: "Tacos filled with pork carnitas prepared in-house, on corn tortillas. Limited quantity, available until sold out." },
    "サッポロ一番 みそラーメン": { n: "Sapporo Ichiban Miso Ramen", d: "Released in 1968 and a landmark in Japan's instant noodle history. A proper miso broth with a sachet of shichimi spice, clinging to thick, chewy noodles." },
    "ペヤングヌードル": { n: "Peyoung Noodle", d: "A cup ramen from Maruka Foods, the makers of the famous Peyoung. This is the one that is not yakisoba. Mostly sold in Tohoku and the northern Kanto region, and almost never seen in Tokyo. Light soy sauce flavour. If you thought Peyoung meant yakisoba, here is your chance to update that." },
    "一平ちゃん 夜店の焼そば": { n: "Ippei-chan Yomise no Yakisoba", d: "The festival-stall sauce paired with its signature mustard mayonnaise, \"Mayo Beam\", is superb. The noodles themselves are infused with sauce. A favourite among bagged yakisoba, and made in a single frying pan." },
    "ひきわり納豆そば": { n: "Hikiwari Natto Soba", d: "Domestic soba noodles made with organic wholegrain buckwheat from Niigata, served with a minced natto broth. A donburi-style noodle that needs no cup — just three minutes of boiling water. A dream for natto lovers." },
    "ZUBAAAN! 鶏油香る鶏中華そば": { n: "ZUBAAAN! Chicken Oil Chuka Soba", d: "From Maruchan's ZUBAAAN! series. Chicken-oil aroma and savoury depth in a chicken-based chuka soba. Light yet deep broth with soft noodles." },
    "ZUBAAAN! 博多豚骨ラーメン": { n: "ZUBAAAN! Hakata Tonkotsu Ramen", d: "From Maruchan's ZUBAAAN! series. Hakata-style rich tonkotsu recreated in a bagged noodle. Creamy pork bone broth clinging to thin noodles — shop-quality at home." },
    "ZUBAAAN! 横浜家系 醤油豚骨": { n: "ZUBAAAN! Yokohama Iekei Shoyu Tonkotsu", d: "From Maruchan's ZUBAAAN! series. The shoyu-tonkotsu broth that defines Yokohama Iekei ramen, in bagged form. A rich broth that loves nori and spinach." },
    "農心 辛ラーメン": { n: "Nongshim Shin Ramyun", d: "Korea's No.1 instant ramen. A beef-bone and chili broth — \"deliciously spicy\" — that has won fans worldwide. The balance of heat and savoury depth is what made it a national dish." },
    "ポックンミョン 韓国風甘辛カルボ": { n: "Bokkeum-myun Korean Sweet & Spicy Carbo", d: "Nissin's take on Korean stir-fried noodles. Chewy noodles coated in a sweet-and-spicy carbonara sauce, creamy and rich. Mild heat with plenty of umami — genuinely addictive." },
    "韓国風旨辛ラーメン（辛ヨン）": { n: "Shin-Yon Korean Spicy Ramen", d: "A Korean-style spicy ramen made in Japan. Spice level 3, with a distinctly punchy broth. Look for the pink packaging." },
    "うまかっちゃん": { n: "Umakacchan", d: "House Foods' classic Kyushu tonkotsu bagged noodle. A seasoning oil sachet brings the pork broth to life. The taste of Kyushu, still beloved in Hakata after all these years." },
    "イチカラそば": { n: "Ichikara Soba", d: "A proper instant soba made with organic wholegrain buckwheat from Niigata. Donburi-style with no cup needed, and a carefully sourced broth. Made from the seed up." },
    "下関ふくらーめん しお味": { n: "Shimonoseki Fugu Ramen (Salt)", d: "A salt-based instant ramen made with Shimonoseki's famous tiger pufferfish. The blue packaging evokes the Kanmon Strait, complete with an endearing pufferfish. Light and refined." },
    "辛ヨン トムヤムクンラーメン": { n: "Shin-Yon Tom Yum Kung Ramen", d: "The Tom Yum Kung version of the Shin-Yon range. Shrimp umami meets the hot-and-sour lift of lemongrass and fish sauce. Spice level 3. Made in Japan." },
    "Sugakiya スガキヤラーメン": { n: "Sugakiya Ramen", d: "Nagoya soul food: Sugakiya's Japanese-style tonkotsu ramen. Non-fried noodles in a creamy, dashi-forward broth. The Tokai region's standard, now 80 years on." },
    "日清 ラ王 柚子しお": { n: "Nissin Raoh Yuzu Shio", d: "Non-fried noodles with a springy, almost fresh-noodle texture. A chicken base layered twice over with yuzu peel from Kochi and bonito extract from Yaizu, for a bright salt broth. A pursuit of the classic, done properly." },
    "アラビヤン焼そば": { n: "Arabiyan Yakisoba", d: "Sanyo Foods has been selling this bagged yakisoba since 1967. Fried noodles, powdered sauce and aonori — that is all — yet the slightly spicy sauce has a devoted following in Kanto. One frying pan and you are done." },
    "中華房 麻辣燙（マーラータン）": { n: "Chukabo Malatang", d: "Malatang, the Sichuan soup dish, with the tingle of sansho pepper and chili. The noodles are non-fried sweet potato starch vermicelli — chewy and gluten free. Includes six ingredients: yuba, carrot, bok choy, sesame and spring onion." },
    "天下一品 京都濃厚鶏白湯": { n: "Tenkaippin Kyoto Rich Chicken Paitan", d: "From Sanyo Foods' \"Famous Shop\" series. Tenkaippin's signature kotteri broth, born in Kyoto, recreated in bagged form. A thick, almost gravy-like chicken paitan with three-minute non-fried noodles. Rich, and unapologetic about it." },
    "元祖長浜屋 豚骨ラーメン": { n: "Ganso Nagahamaya Tonkotsu Ramen", d: "Co-developed by Marutai and Ganso Nagahamaya of Nagahama, Fukuoka. Founded in 1952 and often credited with inventing kaedama, the shop's tonkotsu is faithfully recreated here. A light yet deep broth with ultra-thin non-fried noodles." },
    "出前一丁": { n: "Demae Itcho", d: "A long-seller since 1968. A wisp of the secret sesame oil over a nostalgic chuka soba. Light soy broth lifted by the sesame chili oil — loved across generations." },
    "トッピング（2種選択）": { n: "Toppings (Choose 2)", d: "<b>Egg</b><br><b>Spinach</b><br><b>Takana (pickled mustard greens)</b><br><b>Pickled red ginger</b><br><b>Kikurage mushroom</b><br><b>Corn</b><br><b>Butter</b><br><b>Sliced jalapeño</b><br><b>Shiso</b><br><b>Coriander</b><br><b>Nori (2 sheets)</b><br><b>Small rice</b><br><b>Extra noodles (thin)</b><br><br>Choose any two." },
    "自家製焼豚": { n: "Homemade Chashu", d: "Chashu prepared by the owner. One slice each of pork shoulder and pork belly." },
    "トッピング例": { n: "Topping Example", d: "e.g. ZUBAAAN! Yokohama Iekei Shoyu Tonkotsu ¥500 + Toppings (spinach & nori) ¥200 + Homemade Chashu ¥300 = ¥1,000 total" },
    "キリン一番搾り ミニ缶": { n: "Kirin Ichiban Shibori (Mini Can)", d: "Chilled to the bone. Exactly one Hungry Bug glass from Dorohedoro's worth — a size you can finish." },
    "ミチェラーダ / Michelada": { n: "Michelada", d: "The Michelada is a Mexican beer-based cocktail: tart, bracing and made for hot days. A Clamato version is available for +¥1,000 if you like." },
    "アサヒ スーパードライ": { n: "Asahi Super Dry", d: "Japan's definitive dry beer. Sharp and crisp with a clean finish. Goes with anything on the menu." },
    "サッポロ 黒ラベル": { n: "Sapporo Black Label", d: "The flagship of Hokkaido's Sapporo Brewery. Malt richness and hop aroma in balance — a beer you never tire of." },
    "キリン ハートランド": { n: "Kirin Heartland", d: "Kirin's premium beer, born in 1986. 100% malt, aroma hops, and the same decoction method ever since. The emerald-green returnable bottle is unmistakable." },
    "Bottega グラス": { n: "Bottega (Glass)", d: "Prosecco from Veneto, Italy. Gold on black, and elegant with it. Fine bubbles and bright fruit." },
    "QUARTET ハーフボトル": { n: "QUARTET (Half Bottle)", d: "From Anderson Valley, California, made by Roederer Estate. Creamy bubbles and generous fruit." },
    "Bottega ハーフボトル": { n: "Bottega (Half Bottle)", d: "A half bottle of the Veneto prosecco. Just the right size for two on a special evening." },
    "がぶ飲みシャトージュン・赤": { n: "Chateau Jun Red", d: "100% Yamanashi-grown grapes. Screw cap, low alcohol, dry and easy — a red you really can drink by the glassful." },
    "がぶ飲みシャトージュン・白": { n: "Chateau Jun White", d: "100% Yamanashi-grown grapes. Screw cap, low alcohol, clean and easy — a white you really can drink by the glassful." },
    "がぶ飲みシャトージュン・オレンジ": { n: "Chateau Jun Orange", d: "White grapes vinified like a red, with skins and seeds. Complexity and a little tannin remain, which makes it excellent with spiced dishes. 100% Yamanashi grapes, 11.5% ABV." },
    "サントリー角": { n: "Suntory Kakubin", d: "A long-seller since 1937, blending bourbon-cask malts from the Yamazaki and Hakushu distilleries. Sweet aroma and a solid depth of flavour — and famously good as a highball." },
    "知多": { n: "Chita", d: "A single grain whisky from the Chita distillery in Aichi. Carefully column-distilled and matured in several cask types. Light and silky, with a sweet finish of vanilla and honey." },
    "京都ウイスキー 黒帯": { n: "Kyoto Whisky Kuroobi", d: "Kuroobi, from Kyoto Miyako Distillery — the city's first whisky distillery, set in the nature of the Tanba highlands. It scored 92 points at USC 2021. The Nishijin-ori black-belt label gives it a distinctly Kyoto sense of dignity." },
    "竹鶴 Pure Malt": { n: "Taketsuru Pure Malt", d: "A pure malt named after Masataka Taketsuru, founder of Nikka. A vatting of malts from two distilleries: the heavy, smoky Yoichi and the bright, delicate Miyagikyo, in fine harmony." },
    "白州 NV": { n: "Hakushu NV", d: "A single malt from the Hakushu distillery, deep in the forests of the Southern Alps. Non-vintage, yet it holds fresh green notes and smoke together. Crisp and lively, and superb as a highball." },
    "白州 12年": { n: "Hakushu 12 Year", d: "A single malt aged at least 12 years at Hakushu. Forest-fresh green notes layered with a whisper of smoke and fruity sweetness. The definitive expression of the distillery." },
    "宮城峡 アロマティックイースト 2022": { n: "Miyagikyo Aromatic Yeast 2022", d: "Part of the NIKKA DISCOVERY series from the Miyagikyo distillery, made with a special yeast strain. A single malt marked by bright, fruity aromatics and sweetness." },
    "新道 エクスペリメンタル .02": { n: "Shindo Experimental .02", d: "Shindo Distillery in Fukuoka pursues a crossing of the classic and the new. A layered vatting of peated bourbon casks (67%), virgin mizunara, cognac casks and oloroso sherry casks. Smoke meets a milky, sweet finish." },
    "戸河内 PREMIUM": { n: "Togouchi Premium", d: "A blended Japanese whisky from the Sakurao Distillery in Hiroshima, matured inside the disused Garyuiwa railway tunnel amid the clear streams of the Chugoku mountains. The year-round cool stability gives it a mellow character and deep aroma. 40% ABV, 700ml." },
    "戸河内 Peated Cask Finish": { n: "Togouchi Peated Cask Finish", d: "Togouchi's standard expression given a peated cask finish. The smoke sits softly over the base, adding depth and complexity — a glimpse of where blended Japanese whisky can go. 40% ABV, 700ml." },
    "厚岸 カムイチェップ": { n: "Akkeshi Kamuy Chep", d: "From the Kamui Whisky series by the Akkeshi distillery in Hokkaido. \"Kamuy Chep\" means salmon in Ainu, and a powerful salmon graces the label. A single malt that concentrates peat, sea air and the nature of Akkeshi." },
    "山崎 12年": { n: "Yamazaki 12 Year", d: "The 12-year single malt from Yamazaki, Japan's oldest distillery. Mizunara, bourbon and sherry casks together give floral aromatics and a complex, bitter-chocolate sweetness. This bottling carries Suntory's 2024 centenary label." },
    "響 ブレンダーズチョイス": { n: "Hibiki Blender's Choice", d: "A blended Japanese whisky from Suntory. Malts and grain from Yamazaki, Hakushu and Chita, plus mizunara-matured whisky, make a special blend. Sweet fruit aromas and a woody finish — approachable, but deep." },
    "山崎 18年": { n: "Yamazaki 18 Year", d: "The pinnacle of Yamazaki's single malts, aged at least 18 years at Japan's oldest distillery. Oriental mizunara aromatics, profound sweetness and a very long finish. One of the most acclaimed whiskies Japan has produced." },
    "響 17年": { n: "Hibiki 17 Year", d: "One of the high points of Suntory's blended Japanese whisky. Yamazaki, Hakushu and Chita whiskies blended with great skill: flowers and fruit, honeyed sweetness and the depth mizunara brings. Now discontinued, and increasingly hard to find." },
    "余市 10年": { n: "Yoichi 10 Year", d: "A single malt from the Yoichi distillery in Hokkaido, where Nikka began. Direct coal-fired distillation gives a powerful, peaty character, and ten years of maturation adds depth. Sea minerality and heavy smoke in harmony. 45% ABV." },
    "あかし シングルモルト": { n: "Akashi Single Malt", d: "A single malt Japanese whisky from Eigashima Distillery in Hyogo, vatted from whiskies matured in several cask types. Balanced fruit aromatics with a soft, smoky finish." },
    "BARヨー子 ハイボールレモン": { n: "BAR Yoko Highball Lemon", d: "A considered highball from BAR Yoko at the foot of Mt. Chokai. Malt and grain whisky whose depth and aroma open up with soda, blended generously with whole-pressed Setouchi lemon juice. 40% ABV. We suggest 1:3 with soda. Price includes tax." },
    "あかし シェリーカスク": { n: "Akashi Sherry Cask", d: "From Eigashima's White Oak series in Hyogo. A blended whisky matured in oloroso sherry casks, with the rich sweetness of dried fruit and chocolate and a generous aroma. Remarkable value at ¥500." },
    "イチローズモルト ホワイトラベル": { n: "Ichiro's Malt White Label", d: "A world blended whisky put together by Ichiro Akuto, founder of the Chichibu distillery. Built around Chichibu malt with whiskies vatted from around the world. Non-chill filtered and natural colour, bright and well balanced. 46% ABV." },
    "SOGAINI（ソガイニ）": { n: "SOGAINI", d: "A blended Japanese whisky from the Sakurao Distillery in Hiroshima — the same distillery as Togouchi, offered at a more accessible price. 40% ABV, 700ml." },
    "グレンモーレンジィ オリジナル 10年": { n: "Glenmorangie Original 10 Year", d: "A Highland single malt matured ten years in bourbon casks, opening with vanilla and citrus sweetness. Elegant and easy — an ideal introduction to Scotch." },
    "タリスカー 10年": { n: "Talisker 10 Year", d: "A powerful, maritime single malt from the only distillery on the Isle of Skye. Sea air and peat smoke with a peppery finish. Rugged yet refined — a classic of the Islands." },
    "ブルックラディ ザ・クラシックラディ 10年": { n: "Bruichladdich The Classic Laddie 10 Year", d: "An unpeated single malt from Bruichladdich on Islay. 100% Scottish barley, non-chill filtered. Bright and fruity in a way you would not expect from Islay." },
    "アードベッグ 10年": { n: "Ardbeg 10 Year", d: "One of the smokiest single malts on Islay. Intense peat smoke, sea salt and a tar-like complexity, with sweetness and depth underneath. The one peat lovers reach for." },
    "ラフロイグ 10年": { n: "Laphroaig 10 Year", d: "From Islay's celebrated Laphroaig distillery — one of the most distinctive single malts in the world. Fierce peat smoke, sea salt and medicinal iodine combine into a very long, unmistakable finish. Founded in 1815." },
    "マッカラン 12年 ダブルカスク": { n: "Macallan 12 Year Double Cask", d: "Twelve years from Speyside's great name, Macallan. Matured in both American and European sherry casks. Vanilla, honey and rich fruit in harmony — smooth and refined." },
    "マッカラン 12年 シェリーオークカスク": { n: "Macallan 12 Year Sherry Oak Cask", d: "Macallan's single malt matured exclusively in sherry casks. Oloroso casks from Jerez, Spain, give abundant dried fruit and spice. The essence of Macallan." },
    "マッカラン 18年 シェリーオークカスク": { n: "Macallan 18 Year Sherry Oak Cask", d: "Macallan's 18-year pinnacle, patiently matured in Spanish oloroso sherry casks. Complex and rich with dried fruit, spice and chocolate. Held in the highest regard worldwide." },
    "ボウモア 12年": { n: "Bowmore 12 Year", d: "A single malt from Bowmore, Islay's oldest distillery, founded in 1779. Peat smoke and sea minerality meet chocolate and citrus sweetness — arguably the best way into Islay." },
    "ティーチャーズ ハイランドクリーム": { n: "Teacher's Highland Cream", d: "A blended Scotch from William Teacher & Sons, founded in Glasgow in 1830. The key malt is Ardmore of the Highlands, and the proportion of peated malt is unusually high for a blend, giving real smoke and body. The label says HIGH IN PEATED MALT, and it means it — far more serious than the price suggests." },
    "ハイランドクイーン シェリーカスクフィニッシュ": { n: "Highland Queen Sherry Cask Finish", d: "A blended Scotch named for the \"Queen of the Highlands\", dedicated in 1561 to Mary, Queen of Scots on her return from France. An additional maturation in sherry casks lends mellow sweetness and body, with dried fruit and nuts." },
    "グレンフィディック 12年": { n: "Glenfiddich 12 Year", d: "The standard single malt from Speyside's celebrated Glenfiddich. Fresh pear and creamy vanilla, smooth and light on the palate. The world's best-selling single malt, and a fine place to start." },
    "フォアローゼス": { n: "Four Roses", d: "The standard bourbon from the Four Roses distillery in Kentucky, founded in 1888, blended from its ten distinct bourbon recipes. Sweet, floral and fruity, and remarkably easy to drink. An excellent first bourbon." },
    "ワイルドターキー 8年": { n: "Wild Turkey 8 Year", d: "A straight bourbon from Austin Nichols in Kentucky. Bottled at 101 proof, with bold vanilla, caramel and spice. Big-boned, classic bourbon." },
    "メーカーズマーク": { n: "Maker's Mark", d: "Handmade bourbon from Star Hill Farm in Loretto, Kentucky. Wheat in the mash bill gives a soft palate and caramel sweetness. The red wax seal is known the world over." },
    "ヘブンズドア アセンション": { n: "Heaven's Door Ascension", d: "Ascension, from Heaven's Door — the premium bourbon range created by Bob Dylan. A Kentucky straight bourbon where caramel, oak and spice weave together, with the individuality you would hope for from an artist's label." },
    "I.W.ハーパー 12年": { n: "I.W. Harper 12 Year", d: "A fine Kentucky straight bourbon. Twelve years bring a smooth palate and a neat balance of vanilla, caramel and oak. The cut-glass-style bottle is a piece of design in itself." },
    "ジャックダニエル": { n: "Jack Daniel's", d: "A sour mash whiskey from Lynchburg, Tennessee. The charcoal mellowing process gives its distinctive smoothness, with vanilla and caramel sweetness. The best-selling American whiskey in the world." },
    "オールドパリロード": { n: "Old Pali Road", d: "A rare, hand-crafted whiskey made in Hawaii by the Ko'olau Distillery. Fruity and smooth, born of Oahu's nature and its makers' craft. The label, evoking the Hawaiian landscape, is worth a look too." },
    "カバラン ソリスト ヴィーニョバリック": { n: "Kavalan Solist Vinho Barrique", d: "Cask strength maturation in vinho (wine) barriques at Taiwan's Kavalan distillery. At 57.8% it is powerful, yet dense fruit, wine sweetness and a spicy finish weave together into real complexity. Asia's flagship single malt." },
    "ポールジョン ピーテッド セレクトカスク": { n: "Paul John Peated Select Cask", d: "A peated single malt from the Paul John distillery in Goa, India. Cask strength at 55.5%, non-chill filtered. Smoke that stands up to any Scotch, alongside the tropical sweetness that India's warm climate brings." },
    "ドメーヌ・デ・オート・グラス エピステーメ R16P24": { n: "Domaine des Hautes Glaces Episteme R16P24", d: "A single malt from Domaine des Hautes Glaces, a farm distillery in the Trièves region at the foot of the French Alps. Made from 100% estate-grown rye — craft whisky that truly expresses its terroir. Fresh herbal and grain notes throughout." },
    "ドメーヌ・デ・オート・グラス アンディジェン": { n: "Domaine des Hautes Glaces Indigene", d: "Another single malt from Domaine des Hautes Glaces. As the name Indigène suggests, it is made from local heritage barley. The cool climate and clear water of the French Alps give it a delicate, floral character." },
    "まさひろ オキナワジン Recipe 01": { n: "Masahiro Okinawa Gin Recipe 01", d: "A craft gin from Masahiro Shuzo in Okinawa. Built on an awamori base with shikuwasa, juniper berry, guava leaf, goya, roselle and hihatsumodoki pepper. 47% ABV, 700ml. A distinctive gin made from Okinawan ingredients." },
    "SAKURAO GIN 浜茄子 2025": { n: "SAKURAO GIN Hamanasu 2025", d: "A limited edition of the Japanese dry gin from the Sakurao Distillery in Hiroshima. A small-batch distillation using hamanasu rose hand-picked on the shore opposite Miyajima. The 2025 edition, in a beautiful blue bottle. 47% ABV, 700ml." },
    "まさひろ オキナワジン Recipe 02": { n: "Masahiro Okinawa Gin Recipe 02", d: "The second craft gin from Masahiro Shuzo in Okinawa. An awamori base led by tankan, the local citrus, with juniper berry, mint, aromaticus, getto (shell ginger), ginger and lemongrass. Bright citrus and cooling herbs that lift away cleanly. 47% ABV, 700ml. Worth tasting alongside Recipe 01." },
    "1800 クリスタリーノ": { n: "1800 Cristalino", d: "An añejo tequila from 100% Jalisco blue agave, charcoal filtered to crystal clarity. Agave sweetness and the complexity of barrel ageing side by side. Also served in a 15ml shot glass at the same price." },
    "Don Julio Añejo（ドン フリオ アネホ）": { n: "Don Julio Anejo", d: "Don Julio González, founder in 1942, is the man who took tequila upmarket. 100% blue agave from the Jalisco highlands, aged 18 months in American white oak. Caramel and vanilla sweetness, gentle spice and a silky, lingering finish. Also served in a 15ml shot glass at the same price." },
    "日置蒸溜蔵 甕壺貯蔵 芋（4年）": { n: "Hioki Distillery Kamétsubo Imo, 4 Years", d: "A strictly limited long-aged imo shochu from Komasa Jyozo — the makers of the Kanosuke Japanese whisky — distilled at their Hioki Distillery in Kagoshima, founded in 1883. Kogane Sengan sweet potatoes from Kagoshima and rice koji (black koji) are fermented with Komasa yeast and well water from the Gongen shrine, then aged four years in earthenware pots. Fragrant and gentle on the palate. Only 600 bottles produced." },
    "GAKUの誘惑": { n: "GAKU no Yuwaku", d: "A sherry-cask imo shochu aged ten years, from Nishi Shuzo in Kagoshima — the same house as Tenshi no Yuwaku. Brandy-like richness meets the sweetness of sweet potato. At 40% ABV, it goes well beyond what most people expect of shochu." },
    "三岳（みたけ）": { n: "Mitake", d: "An honkaku imo shochu from Mitake Shuzo on Yakushima, a World Natural Heritage site. Made with the island's famously soft water and Kagoshima sweet potatoes, it is clean and free of any rough edges, with a gentle sweetness. Production is small and it is hard to find even on the island." },
    "イヨシコーラ酎": { n: "Iyoshi Cola-chu", d: "A craft cola spirit from Shinjuku, built on Kagoshima imo shochu with natural ingredients including kola nut, cinnamon, vanilla and clove. The kingfisher label is distinctive — and so is the argument it makes for what shochu can be." },
    "村尾": { n: "Murao", d: "An imo shochu from Murao Shuzo in Kagoshima, made the traditional way with sweet potato and rice koji fermented in earthenware pots. Production is tiny, and it is one of the genuinely hard-to-find bottles. Quiet aromatics, refined mellow flavour and a clean finish." },
    "魔王": { n: "Maou", d: "One of the \"3M\" bottles, made by Shiratama Jozo in Kagoshima. Sweet, fruity aromatics and a smooth, rounded palate — so easy that it barely reads as imo shochu. An ideal introduction, if you can find it." },
    "森伊蔵": { n: "Moriizo", d: "A pot-fermented imo shochu from Moriizo Shuzo in Kagoshima. One of the \"3M\", and available only by lottery. Delicate, fruity aromatics with concentrated sweet potato sweetness — refined and quite unlike anything else." },
    "山椒 AKAYANE CRAFT SPIRITS": { n: "Sansho AKAYANE Craft Spirits", d: "A craft spirit from AKAYANE, the red-roofed koji house founded in 1908. More than a century of shochu craft applied to a distinctive bottling made with Japanese sansho pepper. Bright, citrusy aroma and a tingling finish. Price includes tax." },
    "日置蒸溜蔵 長期熟成 麦（8年）": { n: "Hioki Distillery Long-Aged Mugi, 8 Years", d: "A strictly limited long-aged mugi shochu from Komasa Jyozo — the makers of the Kanosuke Japanese whisky — distilled at their Hioki Distillery in Kagoshima, founded in 1883. Barley and barley koji (white koji) are fermented with Komasa yeast and well water from the Gongen shrine, then aged eight years in American white oak casks. Mellow on the palate, with sweet, generous aromas of vanilla and nuts from the wood. Only 600 bottles produced." },
    "豊永蔵 麦汁": { n: "Toyonagagura Mugijiru", d: "An unfiltered barley shochu from Toyonagagura in Kumamoto. 100% domestic naked barley, barley koji, atmospheric distillation. Leaving it unfiltered keeps the toasty character and the raw aroma of the grain intact. Mellow, and good with water or soda — and with strongly flavoured food." },
    "うかぜ": { n: "Ukaze", d: "An honkaku barley shochu with a soft, watercolour-like label. Straightforward barley sweetness and a light palate make it a very easy place to start." },
    "いいちこ": { n: "iichiko", d: "The definitive barley shochu, from Sanwa Shurui in Oita. \"Iichiko\" means \"good\" in the local dialect. Clean on the palate with a faint barley sweetness — a long-seller loved across Japan." },
    "青鹿毛（あおかげ）": { n: "Aokage", d: "A barley shochu with bold brushwork on a blue label. Generous barley character with a clean palate." },
    "CHILL GREEN（チルグリーン）": { n: "CHILL GREEN", d: "A new-generation flavoured shochu combining barley shochu with maki — a relative of sansho — for a spicy, citrus lift. Bright and quietly addictive. Best on the rocks or with soda." },
    "雲海": { n: "Unkai", d: "The definitive buckwheat shochu, from Unkai Shuzo in Miyazaki. 100% domestic buckwheat, with a clean, fresh aroma and gentle sweetness. The best introduction to soba shochu." },
    "茉莉花": { n: "Matsurika", d: "A jasmine shochu from Suntory — matsurika is the Japanese name for jasmine. Expressive floral aroma with a fresh sweetness, at an easy-going 20% ABV." },
    "胡麻祥酎 紅乙女": { n: "Beni Otome Sesame Shochu", d: "The only sesame shochu in Japan, from Beni Otome Shuzo in Fukuoka. Long-aged and made with over 20% roasted sesame. Toasty aroma, mellow depth and a refined sweetness." },
    "キンミヤ焼酎": { n: "Kinmiya Shochu", d: "The standard korui shochu from Miyazakihonten in Mie. Pure and free of any distracting character, which is exactly why izakayas across Japan use it as the base for Hoppy and chuhai." },
    "1980 はとむぎ焼酎": { n: "1980 Hatomugi Shochu", d: "A long-aged shochu distilled in 1980 from Job's tears (hatomugi) grown in Oita. Soft on the tongue with real depth and a refined character. A rarity in more ways than one." },
    "鍛高譚": { n: "Tantakatan", d: "A shiso shochu from Takasago Shuzo in Hokkaido, made with local red shiso. Bright aroma and a clean palate. Good neat or with soda. 20% ABV. Price includes tax." },
    "金魚": { n: "Kingyo", d: "An elegant way to drink: a shiso leaf as the water weed and a red chili as the goldfish, floating in the glass like an aquarium. We use Kinmiya shochu infused with Japanese and Calabrian chilies. The fresh shiso aroma against the chili heat is a wonderful combination — and yes, it is properly hot." },
    "跳ねる一日": { n: "Haneru Ichinichi", d: "The second in the \"Ichinichi\" series from Wakashio Shuzo in Shibushi, Kagoshima. A base of barley and imo shochu redistilled with yuzu juice and peel for a bright citrus aroma and a clean palate. The name comes from a Satsuma saying: \"Shall I cry or shall I leap? Better to leap than to cry\" — if you are hesitating, move. Look for the leaping goldfish. 27% ABV, 720ml." },
    "米焼酎 ねっか": { n: "Nekka Rice Shochu", d: "An honkaku rice shochu from Nekka in Okuaizu, Fukushima. Made from 100% local rice and vacuum distilled for a clear, expressive character. Fruity ginjo aromatics and a clean finish." },
    "ブラック奄美": { n: "Black Amami", d: "An honkaku kokuto (brown sugar) shochu from Amami Shurui on Tokunoshima, Kagoshima. Kokuto shochu may only be produced in the Amami islands; this one is long-aged in oak casks and bottled at 40%, close to cask strength. Amber in colour, with real depth and a faint sweetness from the brown sugar. Take your time with it, neat or on the rocks." },
    "鍋島 オレンジ ボトル": { n: "Nabeshima Orange (Bottle)", d: "From Fukuchiyo Shuzo in Saga. A junmai ginjo nama-shu, 100% Gohyakumangoku, milled to 55%. Orange-like fruit and a straightforward sweetness, with the vivid spritz that only unpasteurised sake gives. The most playful bottle in the Nabeshima range. <b>Leans sweet</b> and juicy." },
    "獺祭 Blue": { n: "Dassai Blue", d: "Dassai's first sake brewed outside Japan, made at Asahi Shuzo's New York brewery. A junmai daiginjo milled to 50% (Type 50), refined and clear on the nose with a delicate, silky sweetness. A bottle with a story attached. <b>Slightly sweet</b> and aromatic." },
    "Drunk Monkey S 穀良都": { n: "Drunk Monkey S Kokuryomiyako", d: "A distinctive sake made with Kokuryomiyako, a rare heritage rice. The name and the styling are as memorable as the liquid. <b>Slightly dry</b> and clean on the finish. Price includes tax." },
    "極上黒松剣菱": { n: "Gokujo Kuromatsu Kenbishi", d: "The senior bottling from Kenbishi Shuzo, founded in 1505 and Japan's oldest sake brand. Under the motto \"first among all, past and present\", it blends undiluted sake matured over several years. Deep body, a firm finish and the roundness that only age gives. The blue bottle is unmistakable. <b>In sweet-dry terms, umakuchi</b> — neither sweet nor dry, but built around depth. Price includes tax." },
    "四季桜": { n: "Shikizakura", d: "A local sake from Utsunomiya Shuzo in Tochigi, brewed with underground water from the Kinugawa river. A tokubetsu junmai with a good balance of acidity and umami. <b>Slightly dry.</b>" },
    "瑞鷹 くまもとカップ": { n: "Zuiyo Kumamoto Cup", d: "From Zuiyo in Kumamoto, with a charming Kumamon label. Soft on the palate with a quiet umami. <b>Slightly dry</b>, with a clean finish." },
    "黒松剣菱": { n: "Kuromatsu Kenbishi", d: "The signature bottling of Kenbishi Shuzo in Hyogo, a brewery with over 500 years of history. A dry junmai with substantial umami and a sharp finish, good warmed or chilled. <b>In sweet-dry terms, leans umakuchi.</b>" },
    "下関名産 とらふぐ骨酒": { n: "Shimonoseki Torafugu Kotsuzake", d: "Bones of Shimonoseki's famous tiger pufferfish, grilled and steeped to release their flavour into the sake. The refined dashi of torafugu and the character of the sake meet in a way you can really only find in Shimonoseki. The base sake is <b>dry</b>. Served in a cup, so it is easy to enjoy." },
    "おやじ極楽 純吟カップ": { n: "Oyaji Gokuraku Junginjo Cup", d: "A junmai ginjo cup from Chiyomusubi Shuzo in Sakaiminato, Tottori. In the hometown of Shigeru Mizuki, the label naturally features Medama-oyaji — and true to the name \"Oyaji Gokuraku\" (father's paradise), he is soaking in his teacup bath. Refined junmai ginjo aromatics and a soft umami. <b>Slightly dry</b>, with a clean finish." },
    "有磯 曙 本醸造カップ": { n: "Ariiso Akebono Honjozo Cup", d: "A honjozo from Takazawa Brewery in Himi, Toyama, with a wonderfully humorous label of people enjoying a feast. A local sake built to sit alongside the seafood of Toyama Bay: crisp and <b>dry</b>, and it fills out beautifully when warmed." },
    "あさ開 純米辛口 男のドライ": { n: "Asabiraki Junmai Karakuchi Otoko no Dry", d: "A dry junmai from Asabiraki in Morioka, Iwate. The copy reads \"A man's every day is dry\", and the wistful salaryman on the label says the rest. Decidedly <b>dry</b>, as promised, with a clean finish." },
    "中野BC 赤紫蘇の梅酒": { n: "Nakano BC Red Shiso Umeshu", d: "Red shiso paired with Nanko plums from Wakayama, giving this umeshu both its clean shiso character and its distinctive ruby colour. Refreshing, familiar and yet new — a good bottle for a day when you want a small change of pace. A red umeshu that has been a long-seller for over 30 years." },
    "菊正宗 ぽん酒": { n: "Kikumasamune Ponzake", d: "Sake meets ponzu, bright in both flavour and aroma. A distinctive liqueur from a collaboration between Kikumasamune and Mizkan ponzu. 900ml pack, 8% ABV. Price includes tax." },
    "Bar ヨー子 りんご": { n: "Bar Yoko Apple", d: "From the \"Bar Yoko\" liqueur series by Tatenokawa Shuzo in Yamagata. Their junmai daiginjo Tatenokawa is blended with carefully selected apple juice, giving the juicy sweet-tartness of a honey-cored apple pressed whole, with a faintly bitter dryness on the finish. 8% ABV, 720ml." },
    "ドロ沼ヨー子": { n: "Doronuma Yoko", d: "A rich doburoku-style liqueur from Tatenokawa Shuzo. The creamiest and most full-bodied of the Yoko series. Price includes tax." },
    "カンパリ": { n: "Campari", d: "The crimson bitter liqueur born in Milan in 1860. Herbs, spices and fruit give its bright bitterness and sweetness. Good with soda, with orange juice, or as a cocktail base." },
    "BARヨー子 梅酒": { n: "BAR Yoko Umeshu", d: "The umeshu in the BAR Yoko series from the foot of Mt. Chokai. Generous fruit from carefully selected plums with a clean sweet-tartness. On the rocks or with soda. Price includes tax." },
    "ヘネシー VSOP": { n: "Hennessy VSOP", d: "VSOP from the celebrated house of Hennessy. We serve ours topped up into an empty bottle of Calvados Coquerel Pomme d'Yves. Generous dried fruit and vanilla aromas, smooth and well balanced." },
    "Clamato クラマト・トマトカクテル": { n: "Clamato Tomato Cocktail", d: "The classic Canadian tomato cocktail: tomato juice blended with clam broth for a distinctive savoury depth. In Mexico it is the base of a Michelada, and hugely popular. 221ml can — good on its own or with a drink." },
    "クリスチャン ドルーアン クール ド リヨン ポムプリゾニエール": { n: "Christian Drouin Coeur de Lion Pomme Prisonniere", d: "An AOC Calvados from Pays d'Auge, Normandy. An apple has been grown to full size inside the bottle — the \"imprisoned apple\" — which makes it something close to an artwork. Fresh apple aroma meets the depth of aged Calvados." },
    "シンビーノ ジャワティストレート Premium White": { n: "Sinbino Java Tea Straight Premium White", d: "The White version of Premium Java Tea. Where the Red we also serve is firmly tea-forward, this one is lighter and clearer in both colour and flavour. Unsweetened and straight, so it never gets in the way of food. 375ml bottle." },
    "シンビーノ ジャワティストレート Premium Red": { n: "Sinbino Java Tea Straight Premium Red", d: "Premium Java Tea from Otsuka Foods. The Red version, made from 100% leaves grown at Indonesia's highest state-run plantation. Coarse filtration preserves as much of the leaf's own aroma as possible. Caffeine free, unsweetened, and properly made straight tea." },
    "クランベリージュース": { n: "Cranberry Juice", d: "Junzo-sen cranberry juice, 50% fruit. A good balance of sweetness and tartness. Price includes tax." },
    "東方樹葉 茉莉花茶": { n: "Oriental Leaf Jasmine Tea", d: "A serious jasmine tea from Nongfu Spring in China. Natural aroma from the leaves themselves and a clean, unsweetened palate. Enormously popular in China as a premium bottled tea. 500ml." },
    "ABSENTE HEAVEN（アブサント ヘヴン）": { n: "ABSENTE HEAVEN", d: "Born from absinthe, \"the devil's drink\": Japan's first <b>legal herb drink</b>. Supervised by France's ABSENTE, absinthe makers since 1898, it uses the same wormwood, fennel, peppermint and lemon balm as the forbidden spirit that van Gogh and Picasso were said to love. It is alcohol free, so under-20s can get lifted too. Contains caffeine and arginine.<br>The tagline reads \"Awaken your talent — OPEN YOUR DARK EYES\", and the can wears a proud <b>†THUG LIFE†</b>. The herbal hit shocks everyone on the first sip, and then somehow you are hooked. A firm FxxK OFF to repression." },
    "アイスコーヒー": { n: "Iced Coffee", d: "UCC Drip Pod \"Kanteishi no Hokori\" iced coffee. Properly extracted for body and aroma. Price includes tax." },
    "ソイラテ": { n: "Soy Latte", d: "A soy latte made with UCC Drip Pod \"Kanteishi no Hokori\" iced coffee. The mellowness of soy milk against the body of the coffee. Price includes tax." },
    "お茶各種": { n: "Assorted Teas", d: "Choose from barley tea, jasmine tea, oolong tea, green tea or unsweetened black tea. Served in a carafe. Price includes tax." },
    "コカコーラ": { n: "Coca-Cola", d: "Classic Coca-Cola. Price includes tax." },
    "ジンジャエール": { n: "Ginger Ale", d: "Canada Dry Ginger Ale. Crisp and dry. Price includes tax." },
    "ジュース各種": { n: "Assorted Juices", d: "Choose from orange juice, grapefruit juice or tomato juice. Price includes tax." },
    "リッチブレンド（ホットコーヒー）": { n: "Rich Blend (Hot Coffee)", d: "UCC Drip Pod \"Kanteishi no Hokori\" Rich Blend. Brazilian and Honduran beans for a hot coffee with body and aroma. Price includes tax." },
    "アールグレイ（ホット）": { n: "Earl Grey (Hot)", d: "UCC Drip Pod Earl Grey. Bright bergamot aroma in a refined hot tea. Price includes tax." },
    "しょうが紅茶（ホット）": { n: "Ginger Tea (Hot)", d: "Ginger tea from Shimodozono in Kagoshima. The gentle heat of Japanese ginger with the aroma of black tea, in a proper pyramid tea bag. Warming. Price includes tax." },
    "Chocca-Roo-Brew（ホット）": { n: "Chocca-Roo-Brew (Hot)", d: "A chocolate-flavoured rooibos blend from JOE'S TEA Co. in London. Caffeine free, with a softly sweet aroma. Price includes tax." },
    "阿里山 高山茶（ホット）": { n: "Alishan High Mountain Tea (Hot)", d: "Alishan high mountain oolong from Hoho Chaso in Taiwan. Grown at altitude on Alishan, with an expressive aroma and a rounded sweetness. A fine Taiwanese tea. Price includes tax." },
    "京玄米茶（ホット）": { n: "Kyoto Genmaicha (Hot)", d: "Kyo genmaicha from Higashi in Kyoto. A good balance of toasted brown rice and green tea — the kind of cup that settles you. Price includes tax." },
    "Guilty Pleasure Plate": { d: "Pure indulgence. By our AI's rough maths, over 1,500 kcal per serving. Eating it alone will absolutely give you heartburn, so we recommend ordering it for two or more." },
    "Budweiser": { d: "The American lager benchmark. Clean on the palate with a light bitterness. A world standard." },
    "Corona Extra": { d: "The Mexican lager loved worldwide. Golden through clear glass, clean and light on the palate, and traditionally served with a wedge of lime. 4.5% ABV, 330ml." },
    "Hoegaarden 0.0": { d: "The Belgian witbier, alcohol free. Coriander and orange peel keep it bright and refreshing. Zero alcohol, no compromise on the mood." },
    "BRULO LUST FOR LIFE IPA": { d: "The flagship of BRULO, the Belgian low-alcohol craft brewery. Double dry-hopped with Citra, Simcoe and Mosaic for juicy mango, peach and pineapple. Reformulated to 0.5% ABV in March 2026. Vegan certified, with no artificial sweeteners or preservatives. Ideal for a night off, or when tomorrow matters." },
    "BRULO 7 HOP 7 GRAIN IPA": { d: "Seven grains and seven fresh, aromatic hops make a full-bodied beer with an approachable bitterness. 0.5% ABV. Named BEST BEER at the World Alcohol Free Awards 2023." },
    "Delamotte": { d: "A Champagne house founded in 1760, known as the sister of Salon. Delicate and full of minerality." },
    "Laurent Perrier": { d: "A distinguished Champagne house founded in 1812. The Ultra Brut (brut nature) has no dosage, letting the pure Chardonnay character shine." },
    "Jameson": { d: "Founded in Dublin in 1780 and now the world's best-selling Irish whiskey. Triple distillation gives a smooth, clean palate with sweet vanilla and nutty aromas. Equally at home neat or in a highball." },
    "Hendrick's Gin": { d: "A premium craft gin from the Girvan distillery in Scotland, with its unusual infusion of rose and cucumber. Floral and expressive on the nose, clean and refreshing on the palate. The black apothecary bottle is a design classic." },
    "BOMBAY SAPPHIRE": { d: "A London dry gin made in England from a recipe dating to 1761. Ten botanicals are vapour-infused for a clear, elegant character. 47% ABV. Price includes tax." },
    "Belvedere Vodka": { d: "A top-tier premium vodka from Żyrardów, Poland. Made from 100% Dankowskie rye, quadruple distilled and non-chill filtered. Clean and rounded, with faint vanilla and almond." },
    "ABSOLUT TABASCO": { d: "A collaboration between Sweden's ABSOLUT and the world's best-known hot sauce, TABASCO. Chili pepper heat over the clean spine of the vodka. 38% ABV. Price includes tax." },
    "Myers's Rum Original Dark": { d: "The benchmark Jamaican dark rum, blended from nine rums for real complexity, with sweet tropical fruit and molasses on the nose. Rich and full — and a workhorse behind the bar." },
    "LAODI Pure Sugarcane Rhum White": { d: "An organic agricultural rum from Vientiane, Laos, made in the agricole style from pure sugarcane juice. Fresh and clean with a bright aroma — and a beautiful butterfly on the label." },
    "Ron Zacapa Centenario Solera Gran Reserva": { d: "A premium rum from Guatemala, aged in oak by the solera method at 2,300m above sea level. Complex vanilla, dried fruit and spice; silky and rich on the palate. 40% ABV, 750ml." },
    "GLOW EP05 Ride the waves": { d: "EP05 from GLOW, the craft imo shochu series by Wakashio Shuzo in Kagoshima. A pop label built on the theme \"ride the waves\". At an easy 25%, it makes the character of sweet potato shochu genuinely casual." },
    "GLOW EP09 Ray of hope": { d: "EP09 from Wakashio Shuzo's craft imo shochu series GLOW. The theme is \"Ray of hope\" — the idea that each small light eventually becomes hope for someone else. Sweet potato and rice koji, atmospheric distillation, 25%. It shifts character slowly in the glass." },
    "DAIYAME": { d: "The flagship of Hamada Shuzo in Kagoshima. \"Daiyame\" is Kagoshima dialect for an evening drink. Famous for its lychee-like sweet aroma, and best enjoyed on the rocks or with water." },
    "DAIYAME 40°": { d: "The high-proof version of Hamada Shuzo's premium DAIYAME. A startlingly expressive, powerful lychee aroma reminiscent of Alsatian wine, with a dense, fruity palate. Originally export-only, it earned acclaim abroad before its domestic release. Bartenders and mixologists worldwide treat it as a premium spirit rather than simply a shochu." },
    "KIRISHIMA No.8": { d: "An honkaku imo shochu from Kirishima Shuzo in Miyazaki. Built on the theme of \"fleury elegance\", with bright fruity aromatics and a refined sweetness. A clear departure from the classic Kirishima range." },
    "twilight Awamori": { d: "A distinctive spirit built on Okinawan awamori, bottled at cask strength, 44% ABV. The label captures Okinawa at dusk, and the liquid makes a real case for where awamori can go." },
    "Aperol": { d: "An aperitivo born in Padua, Italy. Orange sweetness with its own distinctive bitterness. Loved worldwide as the base of a spritz." },
    "Jägermeister": { d: "From Germany, a blend of 56 herbs, roots, peels and spices. Complex and herbal with sweetness, and a cool finish." },
    "B-10 Limoncello": { d: "Homemade limoncello by Shinji, owner of the Ebisu record bar Bar B-10. Fresh lemon aroma and generous flavour." },
    "MISTIA": { d: "A French muscat liqueur. Inside the frosted bottle is the sweet, expressive aroma of white grapes." },
    "RETURNER": { d: "A tea liqueur made with top-grade Earl Grey leaves approved by the Sri Lanka Tea Board. No colouring and no preservatives — tea liqueur taken seriously." },
    "Bar BenFiddich Green Negroni": { d: "The signature negroni of Bar BenFiddich in Shinjuku, made with a wealth of herbs including lemon myrtle, rosemary, mint and wormwood. Batch No.1." },
    "SCARLET Menta Amaro": { d: "Made by Iseya Shuzo in Sagamiko. A Japanese craft liqueur where mint meets amaro, sweetness and bitterness interlocking beautifully." },
    "Strawberry Wonder": { d: "A strawberry liqueur from CRAFT WONDER. Concentrated ripe strawberry sweetness and aroma, at an approachable 18% ABV." },
    "PRUCIA": { d: "Suntory's French plum liqueur, produced by Louis Royer of Cognac, founded in 1853. Plum spirit matured in brandy casks for a generous, rounded flavour. Best in Class at IWSC 2010. 15% ABV." },
    "Martell Cordon Bleu": { d: "An Extra Old cognac from Martell, one of the oldest houses in Cognac, founded in 1715. Matured in Tronçais oak, with plum, spice and floral notes over a deep finish. A benchmark among the world's great cognacs." },
    "Hennessy X.O × Zhang Enli Year of the Tiger": { d: "A Year of the Tiger limited edition XO created with the Chinese contemporary artist Zhang Enli. The crimson bottle is a striking object in its own right. Over a hundred intricately aged eaux-de-vie blended into the pinnacle of Hennessy X.O." },
  },
  units: {"1杯": "1 glass", "1本": "1 bottle", "1袋": "1 pack", "1皿": "1 plate", "1缶": "1 can", "1人": "1 person", "2本": "2 pcs", "3ピース": "3 pieces", "2種": "2 kinds", "2枚": "2 slices", "1本（300ml）": "1 bottle (300ml)", "1合": "1 go (180ml)", "1カラフェ": "1 carafe"},
  genreDesc: {"food": "Snacks and small plates", "ramen": "The owner's pick of instant noodles. Customize with toppings.", "beer": "Domestic and imported bottled beer", "wine": "A curated wine selection", "whisky": "A curated whisky collection", "spirits": "A curated spirits collection", "shochu": "A curated shochu collection", "nihonshu": "A curated sake collection", "liqueur": "A selection of fine liqueurs", "others": "Other drinks", "softdrink": "Non-alcoholic drinks", "sparkling": "Available by the glass or bottle"},
  ui: {
    tax: '(incl. tax)',
    soldout: '[SOLD OUT]',
    welcomeTitle: 'Thank you for visiting.',
    welcome1: 'Orders cannot be placed from this iPad.<br>Please just tell us what you would like.',
    welcome2: 'You can also view the same menu on your own phone<br>using the QR code below.',
    welcome3: 'The owner is always thirsty.<br>A drink sent his way is never turned down.',
    instaNote: 'Scan the QR code to<br>follow us on Instagram.',
    lineNote: 'Scan the QR code to<br>add our official LINE account.'
  }
};

function omStripSold(n) {
  return n.replace(/<span style='color:red'>【欠品中】<\/span>\s*/, '');
}
function omIsSold(n) { return n.indexOf('【欠品中】') !== -1; }
function omEntry(item) {
  var e = I18N.items[omStripSold(item.name)];
  return e ? e : null;
}
function omName(item) {
  if (LANG === 'ja') return item.name;
  var base = omStripSold(item.name);
  var e = omEntry(item);
  var en = (e && e.n) ? e.n : base;
  return omIsSold(item.name) ? "<span style='color:red'>" + I18N.ui.soldout + "</span> " + en : en;
}
function omDesc(item) {
  var d = item.desc ? item.desc : '';
  if (LANG === 'ja') return d;
  var e = omEntry(item);
  return (e && e.d) ? e.d : d;
}
function omUnit(u) {
  var unit = u ? u : '1杯';
  if (LANG === 'ja') return unit;
  return I18N.units[unit] ? I18N.units[unit] : unit;
}
function omTax() { return LANG === 'ja' ? '（税込）' : I18N.ui.tax; }
function omLabel(o) {
  if (LANG === 'ja') return o.name;
  return o.nameEn ? o.nameEn : o.name;
}
function omPrice(item) {
  if (item.price === 0) return '';
  return '¥' + item.price.toLocaleString() + '<span>' + omTax() + ' / ' + omUnit(item.unit) + '</span>';
}
function toggleLang() {
  LANG = (LANG === 'ja') ? 'en' : 'ja';
  var b = document.getElementById('lang-toggle');
  if (b) b.textContent = (LANG === 'ja') ? 'EN' : '日本語';
  closeModal();
  renderGenreList();
  renderContent();
}

// state
let currentGenreId = null;
let currentSubId = null;

function getGenre(id) { return MENU.find(g => g.id === id); }
function getAllItems(genre) {
  if (genre.subs) {
    return genre.subs.flatMap(s => s.items.map(i => ({...i, subName: s.nameEn})));
  }
  return genre.items || [];
}

function init() {
  renderGenreList();
  selectGenre('top');
}

function renderGenreList() {
  const nav = document.getElementById('genre-list');
  nav.innerHTML = MENU.map(g => {
    const totalItems = g.type === 'top' ? null : (g.subs ? g.subs.reduce((a,s)=>a+s.items.length,0) : (g.items||[]).length);
    const isActive = g.id === currentGenreId;
    const hasSubs = !!g.subs;
    let subsHtml = '';
    if (hasSubs) {
      subsHtml = `<div class="sub-list ${isActive ? 'open' : ''}">` +
        g.subs.map(s => `
          <button class="sub-btn ${s.id === currentSubId ? 'active' : ''}"
                  onclick="selectSub('${g.id}','${s.id}',event)">
            ${omLabel(s)}
            ${g.type === 'top' ? '' : `<span class="sub-count">${s.items.length}</span>`}
          </button>
        `).join('') +
        `</div>`;
    }
    return `
      <div>
        <button class="genre-btn ${isActive ? 'active' : ''}" onclick="selectGenre('${g.id}')">
          <span class="genre-icon">${g.icon}</span>
          <span>${omLabel(g)}</span>
          <span class="genre-count">${totalItems === null ? '' : totalItems}</span>
        </button>
        ${subsHtml}
      </div>
    `;
  }).join('');
}

function selectGenre(id) {
  currentGenreId = id;
  const genre = getGenre(id);
  currentSubId = genre.subs ? genre.subs[0].id : null;
  renderGenreList();
  renderContent();
}

function selectSub(genreId, subId, e) {
  e.stopPropagation();
  currentGenreId = genreId;
  currentSubId = subId;
  renderGenreList();
  renderContent();
}

function renderContent() {
  const genre = getGenre(currentGenreId);

  // Special top page
  if (genre.type === 'top') {
    document.getElementById('genre-title').textContent = '';
    document.getElementById('genre-desc').textContent = '';
    const topGrid = document.getElementById('drink-grid');
    topGrid.classList.add('top-grid');
    const wrapStyle = 'display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:clamp(16px,4vw,40px) 20px;gap:clamp(20px,4vw,36px);';
    const qrBig = 'width:clamp(180px,45vw,260px);height:clamp(180px,45vw,260px);object-fit:contain;';
    let inner = '';
    if (currentSubId === 'top-wifi') {
      inner = `
        <p style="font-size:clamp(18px,3vw,26px);font-weight:600;color:#222;">Wi-Fi</p>
        <img src="${IMAGES['qr_wifi']}" alt="Wi-Fi" style="${qrBig}">
        <div style="text-align:center;line-height:2.2;font-size:clamp(14px,2.2vw,18px);color:#333;">
          <p style="font-weight:600;color:#888;font-size:clamp(11px,1.6vw,13px);letter-spacing:0.08em;margin-bottom:2px;">SSID</p>
          <p style="font-weight:600;color:#222;margin-bottom:12px;">SPWH_L13_D65BAF</p>
          <p style="font-weight:600;color:#888;font-size:clamp(11px,1.6vw,13px);letter-spacing:0.08em;margin-bottom:2px;">PASSWORD</p>
          <p style="font-weight:600;color:#222;">Omnivore2025</p>
        </div>
      `;
    } else if (currentSubId === 'top-insta') {
      inner = `
        <p style="font-size:clamp(18px,3vw,26px);font-weight:600;color:#222;">Instagram</p>
        <img src="${IMAGES['qr_insta']}" alt="Instagram" style="${qrBig}">
        <p style="text-align:center;font-size:clamp(13px,2vw,16px);color:#555;line-height:2;">${LANG === 'ja' ? 'QRコードから<br>Instagramをフォローいただけます。' : I18N.ui.instaNote}</p>
      `;
    } else if (currentSubId === 'top-line') {
      inner = `
        <p style="font-size:clamp(18px,3vw,26px);font-weight:600;color:#222;">LINE</p>
        <img src="${IMAGES['qr_line']}" alt="LINE" style="${qrBig}">
        <p style="text-align:center;font-size:clamp(13px,2vw,16px);color:#555;line-height:2;">${LANG === 'ja' ? 'QRコードから<br>LINE公式アカウントを追加いただけます。' : I18N.ui.lineNote}</p>
      `;
    } else {
      inner = `
        <div style="text-align:center;line-height:2;font-size:clamp(13px,2vw,15px);color:#444;max-width:460px;">
          <p style="font-size:clamp(16px,3vw,24px);font-weight:600;color:#222;margin-bottom:12px;">${LANG === 'ja' ? 'ご来店いただきありがとうございます。' : I18N.ui.welcomeTitle}</p>
          <p>${LANG === 'ja' ? 'こちらのiPadからは注文できませんので、<br>ご注文はお気軽に口頭でお申し付けください。' : I18N.ui.welcome1}</p>
          <p style="margin-top:10px;">${LANG === 'ja' ? 'また、下記QRコードより携帯でも<br>同じメニューをご覧いただけます。' : I18N.ui.welcome2}</p>
        </div>
        <img src="${IMAGES['qr_code']}" alt="QRコード" style="width:clamp(140px,30vw,220px);height:clamp(140px,30vw,220px);object-fit:contain;">
        <p style="text-align:center;font-size:clamp(14px,2.5vw,20px);font-weight:600;color:#222;line-height:2;">${LANG === 'ja' ? '一緒に乾杯できる準備もできておりますので、<br>お気軽にお声がけください。' : I18N.ui.welcome3}</p>
      `;
    }
    topGrid.innerHTML = `<div style="${wrapStyle}">${inner}</div>`;
    return;
  }

  let items, titleEn, desc;

  if (genre.subs && currentSubId) {
    const sub = genre.subs.find(s => s.id === currentSubId);
    items = sub.items;
    titleEn = genre.nameEn + ' — ' + sub.nameEn;
    desc = genre.desc;
  } else {
    items = genre.items || [];
    titleEn = genre.nameEn;
    desc = genre.desc;
  }

  document.getElementById('genre-title').textContent = titleEn;
  document.getElementById('genre-desc').textContent = (LANG === 'ja') ? desc : (I18N.genreDesc[genre.id] ? I18N.genreDesc[genre.id] : desc);

  const grid = document.getElementById('drink-grid');
  grid.classList.remove('top-grid');
  if (currentSubId !== "ramen-toppings") items = [...items].sort((a, b) => a.price - b.price);
  grid.innerHTML = items.map((item, i) => {
    const mediaHtml = item.img && IMAGES[item.img]
      ? `<div class="drink-img-wrap"><img src="${IMAGES[item.img]}" alt="${item.name}" loading="lazy" decoding="async"></div>`
      : `<div class="drink-emoji-wrap">${item.emoji || '🍶'}</div>`;
    return `
      <div class="drink-card" onclick="openModal(${i})" style="animation-delay:${i*0.05}s">
        ${mediaHtml}
        ${item.cardImgOnly ? '' : `<div class="drink-info">
          <div class="drink-name">${omName(item)}</div>
          <div class="drink-price">${omPrice(item)}</div>
        </div>`}
      </div>
    `;
  }).join('');

  // store current items for modal
  window._currentItems = items;
  window._currentGenreEn = genre.nameEn;
}

function openModal(i) {
  const item = window._currentItems[i];
  const wrap = document.getElementById('modal-img-wrap');
  if (item.img && IMAGES[item.img]) {
    wrap.style.display = '';
    wrap.innerHTML = `<img src="${IMAGES[item.img]}" alt="${item.name}">`;
  } else {
    wrap.style.display = '';
    wrap.innerHTML = `<span class="modal-emoji">${item.emoji || '🍶'}</span>`;
  }
  document.getElementById('modal-genre-tag').textContent = window._currentGenreEn;
  document.getElementById('modal-genre-tag').style.display = '';
  document.getElementById('modal-name').innerHTML = omName(item);
  document.getElementById('modal-desc').innerHTML = omDesc(item);
  document.getElementById('modal-price').innerHTML = omPrice(item);
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
var overlay = document.getElementById('modal-overlay');
overlay.addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});
overlay.addEventListener('touchend', function(e) {
  if (e.target === this) { e.preventDefault(); closeModal(); }
});

init();
</script>
</body>
</html>
